<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Master Terminal - Claude AI</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tv: {
                            bg: '#131722',
                            card: '#1e222d',
                            border: '#2a2e39',
                            hover: '#2a2e39',
                            blue: '#2962ff',
                            green: '#089981',
                            red: '#f23645',
                            text: '#d1d4dc',
                            muted: '#787b86'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #131722; color: #d1d4dc; font-family: -apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, Ubuntu, sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #131722; }
        ::-webkit-scrollbar-thumb { background: #2a2e39; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #363a45; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

    <!-- ==========================================
         1. TOP TOOLBAR / NAVIGATION UI
         ================================---------- -->
    <header class="h-12 bg-tv-card border-b border-tv-border flex items-center justify-between px-3 text-xs shrink-0">
        <!-- Left Section: Logo & Pair Selector Dropdown -->
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 font-bold text-sm text-white tracking-wide pr-3 border-r border-tv-border">
                <i data-lucide="candlestick-chart" class="w-5 h-5 text-tv-blue"></i>
                <span>TRADING<span class="text-tv-blue">MASTER</span></span>
            </div>

            <!-- Pair Selector Dropdown -->
            <div class="flex items-center gap-2">
                <div class="relative flex items-center">
                    <i data-lucide="search" class="w-3.5 h-3.5 absolute left-2.5 text-tv-muted z-10"></i>
                    <select id="pairSelect" onchange="onPairDropdownChange(this.value)" class="bg-tv-bg border border-tv-border hover:border-tv-muted focus:border-tv-blue rounded pl-8 pr-4 py-1 text-xs font-mono font-semibold uppercase text-white focus:outline-none transition cursor-pointer">
                        <optgroup label="⭐ Komoditas & Logam">
                            <option value="XAUUSD">XAUUSD (Gold / Emas)</option>
                            <option value="XAGUSD">XAGUSD (Silver / Perak)</option>
                            <option value="USOIL">USOIL (Crude Oil)</option>
                        </optgroup>
                        <optgroup label="💱 Forex Majors">
                            <option value="EURUSD">EURUSD</option>
                            <option value="GBPUSD">GBPUSD</option>
                            <option value="USDJPY">USDJPY</option>
                            <option value="AUDUSD">AUDUSD</option>
                            <option value="USDCAD">USDCAD</option>
                            <option value="GBPJPY">GBPJPY</option>
                        </optgroup>
                        <optgroup label="₿ Crypto">
                            <option value="BTCUSDT">BTCUSDT (Bitcoin)</option>
                            <option value="ETHUSDT">ETHUSDT (Ethereum)</option>
                            <option value="SOLUSDT">SOLUSDT (Solana)</option>
                            <option value="XRPUSDT">XRPUSDT (XRP)</option>
                        </optgroup>
                        <optgroup label="📈 Indices / Saham Global">
                            <option value="US30">US30 (Dow Jones)</option>
                            <option value="NAS100">NAS100 (Nasdaq)</option>
                            <option value="SPX500">SPX500 (S&P 500)</option>
                            <option value="GER40">GER40 (DAX Germany)</option>
                        </optgroup>
                    </select>
                </div>
            </div>
        </div>

        <!-- Center Section: Method Selectors -->
        <div class="hidden lg:flex items-center gap-1 bg-tv-bg p-0.5 border border-tv-border rounded">
            <button onclick="setMethod('Scalping')" id="m-Scalping" class="method-btn px-3 py-1 rounded text-xs font-medium transition bg-tv-blue text-white">Scalping</button>
            <button onclick="setMethod('Intraday')" id="m-Intraday" class="method-btn px-3 py-1 rounded text-xs font-medium transition text-tv-muted hover:text-white">Intraday</button>
            <button onclick="setMethod('Swing')" id="m-Swing" class="method-btn px-3 py-1 rounded text-xs font-medium transition text-tv-muted hover:text-white">Swing</button>
            <button onclick="setMethod('Day Trading')" id="m-Day Trading" class="method-btn px-3 py-1 rounded text-xs font-medium transition text-tv-muted hover:text-white">Day Trading</button>
        </div>

        <!-- Right Section: Execute Button -->
        <div class="flex items-center gap-2">
            <button onclick="generateAnalysis()" id="generateBtn" class="flex items-center gap-1.5 bg-tv-blue hover:bg-blue-600 text-white font-semibold px-4 py-1.5 rounded transition shadow-md">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                <span>Generate (Claude AI)</span>
            </button>
        </div>
    </header>

    <!-- MOBILE METHOD SELECTOR BAR -->
    <div class="lg:hidden bg-tv-card border-b border-tv-border p-1.5 flex justify-between items-center gap-1 text-xs overflow-x-auto">
