        :root {
            --bg-color: #0b0e14;
            --panel-bg: #151b22;
            --border-color: #30363d;
            --accent-gold: #d4af37;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --green: #2ea043;
            --red: #f85149;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 { color: var(--accent-gold); margin: 0; font-size: 22px; }
        .subtitle { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 15px; }
        @media(max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .btn-scan {
            background: var(--accent-gold);
            color: #0b0e14;
            border: none;
            padding: 14px;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-scan:hover { background: #b89728; }
        .console {
            background: #090d12;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            color: #58a6ff;
            height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-green { background: rgba(46, 160, 67, 0.2); color: var(--green); border: 1px solid var(--green); }
    </style>
</head>

    const DEEPSEEK_KEY = "AMSl9J6f9043RZ55PCoIUA==";
    const SYMBOL = "XAUUSD";

    function printLog(msg) {
        const consoleEl = document.getElementById("consoleLog");
        const time = new Date().toLocaleTimeString();
        consoleEl.innerText += `\n[${time}] ${msg}`;
        consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    async function startScanner() {
        printLog("Memulai proses pemindaian XAUUSD...");
        document.getElementById("signalOutput").innerText = "Sedang mengambil data & menganalisis...";

        try {
            printLog(`Mengambil data candle M5 dari MetaApi (Akun: ${ACCOUNT_ID})...`);
            
            const now = new Date();
            const past = new Date(now.getTime() - 4 * 60 * 60 * 1000);
            const metaUrl = `https://mt-client-api-v1.agiliumtrade.ai/users/current/accounts/${ACCOUNT_ID}/historical-market-data/symbols/${SYMBOL}/timeframes/5m/candles?startTime=${past.toISOString()}`;

            let response;
            try {
                response = await fetch(metaUrl, {
                    headers: { "auth-token": META_TOKEN }
                });
            } catch (err) {
                printLog("Menggunakan CORS Proxy alternatif...");
                response = await fetch(`https://corsproxy.io/?${encodeURIComponent(metaUrl)}`, {
                    headers: { "auth-token": META_TOKEN }
                });
            }

            if (!response.ok) {
                throw new Error(`Gagal mengambil data broker (${response.status}). Pastikan akun MetaApi Anda dalam status aktif/deployed.`);
            }

            const candles = await response.json();
            if (!candles || candles.length === 0) {
                throw new Error("Data candle kosong dari broker.");
            }

            const latestPrice = candles[candles.length - 1].close;
            printLog(`Harga XAUUSD Running: ${latestPrice}`);

            printLog("Mengirim data ke DeepSeek AI untuk analisis struktur SMC & ICT...");

            const dsUrl = "https://api.deepseek.com/chat/completions";
            const dsBody = {
                model: "deepseek-chat",
                messages: [
                    {
                        role: "system",
                        content: "Anda adalah analis SMC dan ICT profesional. Berikan analisis tren, zona Order Block/FVG, serta format sinyal ringkas: ACTION (BUY/SELL/NO_TRADE), ENTRY ZONE, STOP LOSS, dan TAKE PROFIT."
                    },
                    {
                        role: "user",
                        content: `Analisis data M5 XAUUSD berikut: ${JSON.stringify(candles.slice(-20))}. Harga saat ini: ${latestPrice}.`
                    }
                ],
                stream: false
            };

            let dsResponse;
            try {
                dsResponse = await fetch(dsUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${DEEPSEEK_KEY}`
                    },
                    body: JSON.stringify(dsBody)
                });
            } catch (err) {
                dsResponse = await fetch(`https://corsproxy.io/?${encodeURIComponent(dsUrl)}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${DEEPSEEK_KEY}`
                    },
                    body: JSON.stringify(dsBody)
                });
            }

            const dsData = await dsResponse.json();
            if (!dsData.choices || dsData.choices.length === 0) {
                throw new Error("Respon DeepSeek AI tidak valid.");
            }

            const resultText = dsData.choices[0].message.content;
            printLog("Analisis Selesai!");
            document.getElementById("signalOutputinnerHTML") = "";
            document.getElementById("signalOutput").innerText = resultText;

        } catch (error) {
            printLog(`[ERROR] ${error.message}`);
            document.getElementById("signalOutput").innerText = `Error: ${error.message}`;
        }
    }
