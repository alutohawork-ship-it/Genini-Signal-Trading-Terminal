<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trader Receh - CurrencyFreak & DeepSeek Terminal</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #151b22;
            --border-color: #30363d;
            --accent-gold: #d4af37;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --green: #2ea043;
            --red: #f85149;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 { color: var(--accent-gold); margin: 0; font-size: 22px; }
        .subtitle { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 15px; }
        @media(max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        input {
            width: 100%;
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 13px;
        }
        .btn-scan {
            background: var(--accent-gold);
            color: #0b0e14;
            border: none;
            padding: 14px;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn-scan:hover { background: #b89728; }
        .console {
            background: #090d12;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            color: #58a6ff;
            height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-green { background: rgba(46, 160, 67, 0.2); color: var(--green); border: 1px solid var(--green); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>TRADER RECEH TERMINAL</h1>
            <div class="subtitle">XAUUSD Live Feed via CurrencyFreak & DeepSeek AI Analysis</div>
        </div>
        <div>
            <span class="badge badge-green">CurrencyFreak Active</span>
        </div>
    </header>

    <div class="card">
        <div class="input-group">
            <label>API Key CurrencyFreak Anda:</label>
            <input type="text" id="cfKey" placeholder="Tempel API Key CurrencyFreak Anda di sini...">
        </div>
        <button class="btn-scan" onclick="startScanner()">JALANKAN PEMINDAIAN & ANALISIS SIGNALS</button>
    </div>

    <div class="grid-2">
        <div class="card">
            <h3 style="color:var(--accent-gold); margin-top:0;">Signal Dashboard</h3>
            <div id="signalOutput" style="line-height: 1.6; font-size: 14px; white-space: pre-line;">
                <i>Menunggu pemindaian...</i>
            </div>
        </div>

        <div class="card">
            <h3 style="color:var(--accent-gold); margin-top:0;">Console Process Log</h3>
            <div id="consoleLog" class="console">[SYSTEM] Terminal siap mendeteksi XAUUSD via CurrencyFreak...</div>
        </div>
    </div>
</div>

<script>
    const DEEPSEEK_KEY = "AMSl9J6f9043RZ55PCoIUA==";

    function printLog(msg) {
        const consoleEl = document.getElementById("consoleLog");
        const time = new Date().toLocaleTimeString();
        consoleEl.innerText += `\n[${time}]${msg}`;
        consoleEl.scrollTop = consoleEl.scrollHeight;
    }

            alert("Harap masukkan API Key CurrencyFreak Anda terlebih dahulu!");
            return;
        }
